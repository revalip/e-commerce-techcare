<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="vgenBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="50%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="vgenBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="vgenHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#a7f3d0"/>
      <stop offset="70%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="goldPinVgen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadowVgen" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#shadowVgen)" transform="translate(60, 40)">
    <!-- 2.5" Casing -->
    <rect x="0" y="0" width="280" height="210" rx="14" fill="url(#vgenBody)" stroke="#3f3f46" stroke-width="1.8"/>
    
    <!-- Outer Inset -->
    <rect x="12" y="12" width="256" height="186" rx="10" fill="#0d0d10" stroke="#1f1f23" stroke-width="1"/>

    <!-- Screws -->
    <circle cx="20" cy="20" r="3.5" fill="#52525b"/>
    <circle cx="260" cy="20" r="3.5" fill="#52525b"/>
    <circle cx="20" cy="190" r="3.5" fill="#52525b"/>
    <circle cx="260" cy="190" r="3.5" fill="#52525b"/>

    <!-- Label Card -->
    <rect x="28" y="28" width="224" height="154" rx="8" fill="#141418" stroke="#2a2a32" stroke-width="1"/>
    
    <!-- Top Blue Accent Ribbon -->
    <rect x="28" y="28" width="224" height="6" rx="3" fill="url(#vgenBlueGrad)"/>

    <!-- V-GeN Brand Logo -->
    <text x="140" y="68" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="2" text-anchor="middle">V-GeN</text>
    <text x="140" y="86" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" text-anchor="middle">PLATINUM SERIES</text>

    <!-- Main Spec Box -->
    <rect x="44" y="100" width="192" height="34" rx="6" fill="#0b0b0e" stroke="#2563eb" stroke-width="1.2"/>
    <text x="140" y="121" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SOLID STATE DRIVE 2.5"</text>

    <!-- Holographic Official Warranty Seal -->
    <rect x="44" y="142" width="60" height="22" rx="4" fill="url(#vgenHolo)" stroke="#ca8a04" stroke-width="0.8"/>
    <text x="74" y="156" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">GARANSI 3TH</text>

    <!-- Tech Details -->
    <text x="175" y="152" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">SATA III 6Gbps • Read 550MB/s</text>
    <text x="175" y="162" fill="#64748b" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Silicon Motion • Smart ECC</text>

    <!-- Bottom SATA Pin Bay -->
    <rect x="160" y="202" width="100" height="18" rx="2" fill="#0b0b0e"/>
    <rect x="170" y="206" width="30" height="8" rx="1" fill="url(#goldPinVgen)"/>
    <rect x="206" y="206" width="48" height="8" rx="1" fill="url(#goldPinVgen)"/>
  </g>
</svg>
