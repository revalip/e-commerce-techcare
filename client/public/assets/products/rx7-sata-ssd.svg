<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="rx7Body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="50%" stop-color="#18181a"/>
      <stop offset="100%" stop-color="#0f0f10"/>
    </linearGradient>
    <linearGradient id="rx7RedAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadowSata" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadowSata)" transform="translate(60, 40)">
    <!-- 2.5" SATA Outer Casing (Rounded rect, standard 100mm x 70mm ratio) -->
    <rect x="0" y="0" width="280" height="210" rx="14" fill="url(#rx7Body)" stroke="#3f3f46" stroke-width="1.8"/>
    
    <!-- Casing Texture Inset -->
    <rect x="12" y="12" width="256" height="186" rx="10" fill="#141416" stroke="#27272a" stroke-width="1"/>

    <!-- Mounting screw corners -->
    <circle cx="20" cy="20" r="3.5" fill="#52525b"/>
    <circle cx="260" cy="20" r="3.5" fill="#52525b"/>
    <circle cx="20" cy="190" r="3.5" fill="#52525b"/>
    <circle cx="260" cy="190" r="3.5" fill="#52525b"/>

    <!-- Brand Label Sticker -->
    <rect x="30" y="30" width="220" height="150" rx="8" fill="#1c1c1f" stroke="#333338" stroke-width="1"/>
    
    <!-- Decorative Red Cyber Slash -->
    <polygon points="30,30 110,30 75,180 30,180" fill="url(#rx7RedAccent)" opacity="0.9"/>

    <!-- RX7 Gaming Typography -->
    <text x="160" y="75" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="3" text-anchor="middle">RX7</text>
    <text x="160" y="94" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">SOLID STATE DRIVE</text>
    
    <!-- Specs Banner -->
    <rect x="85" y="110" width="150" height="28" rx="6" fill="#09090b" stroke="#ef4444" stroke-width="1"/>
    <text x="160" y="128" fill="#f4f4f5" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SATA III 6Gb/s • 2.5"</text>

    <!-- Subtext -->
    <text x="160" y="162" fill="#71717a" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">SPEED UP TO 520MB/s • 3D NAND</text>

    <!-- Bottom SATA Connector Bay (Exposed notch) -->
    <rect x="160" y="202" width="100" height="18" rx="2" fill="#09090b"/>
    <!-- SATA 7-Pin Data Pins -->
    <rect x="170" y="206" width="30" height="8" rx="1" fill="url(#goldPin)"/>
    <!-- SATA 15-Pin Power Pins -->
    <rect x="206" y="206" width="48" height="8" rx="1" fill="url(#goldPin)"/>
  </g>
</svg>
