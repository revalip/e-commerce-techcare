<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="kyoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="kyoCyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldPinKyo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadowKyo" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadowKyo)" transform="translate(60, 40)">
    <!-- 2.5" Metal Casing -->
    <rect x="0" y="0" width="280" height="210" rx="14" fill="url(#kyoBody)" stroke="#475569" stroke-width="1.8"/>
    
    <!-- Metallic Inset Line -->
    <rect x="10" y="10" width="260" height="190" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

    <!-- Screw Mounts -->
    <circle cx="18" cy="18" r="3.5" fill="#64748b"/>
    <circle cx="262" cy="18" r="3.5" fill="#64748b"/>
    <circle cx="18" cy="192" r="3.5" fill="#64748b"/>
    <circle cx="262" cy="192" r="3.5" fill="#64748b"/>

    <!-- Brushed Aluminum Inset -->
    <rect x="25" y="25" width="230" height="160" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Cyan Geometric Accent Stripe -->
    <rect x="25" y="25" width="8" height="160" rx="4" fill="url(#kyoCyanAccent)"/>
    <line x1="25" y1="95" x2="255" y2="95" stroke="#334155" stroke-width="1"/>

    <!-- Brand Typography -->
    <text x="145" y="65" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle">KYO</text>
    <text x="145" y="84" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">KAIZEN SERIES</text>

    <!-- Specs Container -->
    <rect x="55" y="112" width="180" height="32" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="1"/>
    <text x="145" y="132" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2.5" SATA III 6.0Gb/s</text>

    <!-- Performance Details -->
    <text x="145" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">UP TO 550MB/s • ULTRA SLIM 7MM • 3D TLC</text>

    <!-- Bottom SATA Pin Bay -->
    <rect x="160" y="202" width="100" height="18" rx="2" fill="#090d16"/>
    <rect x="170" y="206" width="30" height="8" rx="1" fill="url(#goldPinKyo)"/>
    <rect x="206" y="206" width="48" height="8" rx="1" fill="url(#goldPinKyo)"/>
  </g>
</svg>
