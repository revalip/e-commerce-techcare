<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="100%" height="100%">
  <defs>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="shadowMo" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#shadowMo)" transform="translate(40, 20)">
    <!-- Ergonomic Mouse Shell Top View -->
    <path d="M 125 45 C 160 45, 195 75, 195 160 C 195 240, 160 260, 125 260 C 90 260, 55 240, 55 160 C 55 75, 90 45, 125 45 Z" fill="url(#mouseBody)" stroke="#52525b" stroke-width="2"/>
    
    <!-- Left & Right Click Split Line -->
    <line x1="125" y1="45" x2="125" y2="125" stroke="#18181b" stroke-width="3"/>
    
    <!-- Scroll Wheel Slot -->
    <rect x="119" y="65" width="12" height="32" rx="6" fill="#09090b"/>
    <!-- Metal Scroll Wheel Accent -->
    <rect x="121" y="70" width="8" height="22" rx="4" fill="#a1a1aa" stroke="#3b82f6" stroke-width="1"/>

    <!-- Thumb Rest Flare (Left Side) -->
    <path d="M 60 130 C 45 150, 45 190, 62 210 Z" fill="#27272a"/>

    <!-- Subtle TechCare LED Logo Palm Glow -->
    <path d="M 125 195 L 120 205 L 130 205 Z" fill="#3b82f6" opacity="0.8"/>
    <circle cx="125" cy="215" r="3" fill="#3b82f6" opacity="0.8"/>
  </g>
</svg>
