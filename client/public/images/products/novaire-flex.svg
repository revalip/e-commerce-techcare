<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="oliveBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a9a86"/>
      <stop offset="50%" stop-color="#556b4f"/>
      <stop offset="100%" stop-color="#3b4d36"/>
    </linearGradient>
    <linearGradient id="champagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="50%" stop-color="#d6c2a8"/>
      <stop offset="100%" stop-color="#ba9f83"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)" transform="translate(10, 10)">
    <!-- Headband Arc Sage Olive -->
    <path d="M 60 160 C 60 55, 240 55, 240 160" fill="none" stroke="url(#oliveBand)" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Champagne Metallic Slider Extensions -->
    <rect x="52" y="145" width="16" height="42" rx="4" fill="url(#champagne)"/>
    <rect x="232" y="145" width="16" height="42" rx="4" fill="url(#champagne)"/>

    <!-- Left Ear Cup: Rounded Modern Rectangular -->
    <rect x="24" y="156" width="72" height="82" rx="24" fill="#4d5f47" stroke="url(#champagne)" stroke-width="3"/>
    <rect x="36" y="168" width="48" height="58" rx="16" fill="#364332"/>
    <circle cx="60" cy="197" r="8" fill="url(#champagne)"/>

    <!-- Right Ear Cup: Rounded Modern Rectangular -->
    <rect x="204" y="156" width="72" height="82" rx="24" fill="#4d5f47" stroke="url(#champagne)" stroke-width="3"/>
    <rect x="216" y="168" width="48" height="58" rx="16" fill="#364332"/>
    <circle cx="240" cy="197" r="8" fill="url(#champagne)"/>
  </g>
</svg>
