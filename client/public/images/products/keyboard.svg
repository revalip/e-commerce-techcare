<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="100%" height="100%">
  <defs>
    <linearGradient id="kbCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="shadowK" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#shadowK)" transform="translate(15, 30)">
    <!-- Keyboard Chassis -->
    <rect x="20" y="50" width="290" height="150" rx="14" fill="url(#kbCase)" stroke="#3f3f46" stroke-width="3"/>
    
    <!-- Keycap Plate Background with Subtle RGB Underglow -->
    <rect x="30" y="60" width="270" height="130" rx="8" fill="#09090b"/>
    
    <!-- Function Row Keycaps -->
    <g fill="#3f3f46">
      <rect x="36" y="66" width="18" height="14" rx="3" fill="#ef4444"/> <!-- ESC Key in Accent Red -->
      <rect x="60" y="66" width="18" height="14" rx="3"/>
      <rect x="82" y="66" width="18" height="14" rx="3"/>
      <rect x="104" y="66" width="18" height="14" rx="3"/>
      <rect x="126" y="66" width="18" height="14" rx="3"/>
      <rect x="156" y="66" width="18" height="14" rx="3"/>
      <rect x="178" y="66" width="18" height="14" rx="3"/>
      <rect x="200" y="66" width="18" height="14" rx="3"/>
      <rect x="222" y="66" width="18" height="14" rx="3"/>
      <circle cx="282" cy="73" r="8" fill="#e4e4e7" stroke="#71717a" stroke-width="2"/> <!-- Rotary Volume Knob -->
    </g>

    <!-- Number Row -->
    <g fill="#27272a">
      <rect x="36" y="86" width="16" height="16" rx="3"/>
      <rect x="56" y="86" width="16" height="16" rx="3"/>
      <rect x="76" y="86" width="16" height="16" rx="3"/>
      <rect x="96" y="86" width="16" height="16" rx="3"/>
      <rect x="116" y="86" width="16" height="16" rx="3"/>
      <rect x="136" y="86" width="16" height="16" rx="3"/>
      <rect x="156" y="86" width="16" height="16" rx="3"/>
      <rect x="176" y="86" width="16" height="16" rx="3"/>
      <rect x="196" y="86" width="16" height="16" rx="3"/>
      <rect x="216" y="86" width="16" height="16" rx="3"/>
      <rect x="236" y="86" width="16" height="16" rx="3"/>
      <rect x="256" y="86" width="36" height="16" rx="3" fill="#3f3f46"/> <!-- Backspace -->
    </g>

    <!-- Alpha Row 1 -->
    <g fill="#52525b">
      <rect x="36" y="108" width="24" height="16" rx="3"/> <!-- Tab -->
      <rect x="64" y="108" width="16" height="16" rx="3"/>
      <rect x="84" y="108" width="16" height="16" rx="3"/>
      <rect x="104" y="108" width="16" height="16" rx="3"/>
      <rect x="124" y="108" width="16" height="16" rx="3"/>
      <rect x="144" y="108" width="16" height="16" rx="3"/>
      <rect x="164" y="108" width="16" height="16" rx="3"/>
      <rect x="184" y="108" width="16" height="16" rx="3"/>
      <rect x="204" y="108" width="16" height="16" rx="3"/>
      <rect x="224" y="108" width="16" height="16" rx="3"/>
      <rect x="244" y="108" width="16" height="16" rx="3"/>
      <rect x="264" y="108" width="28" height="16" rx="3" fill="#3b82f6"/> <!-- Enter Key in Tech Blue -->
    </g>

    <!-- Alpha Row 2 -->
    <g fill="#52525b">
      <rect x="36" y="130" width="30" height="16" rx="3"/> <!-- Caps -->
      <rect x="70" y="130" width="16" height="16" rx="3"/>
      <rect x="90" y="130" width="16" height="16" rx="3"/>
      <rect x="110" y="130" width="16" height="16" rx="3"/>
      <rect x="130" y="130" width="16" height="16" rx="3"/>
      <rect x="150" y="130" width="16" height="16" rx="3"/>
      <rect x="170" y="130" width="16" height="16" rx="3"/>
      <rect x="190" y="130" width="16" height="16" rx="3"/>
      <rect x="210" y="130" width="16" height="16" rx="3"/>
      <rect x="230" y="130" width="16" height="16" rx="3"/>
      <rect x="250" y="130" width="42" height="16" rx="3"/>
    </g>

    <!-- Bottom Modifier & Spacebar Row -->
    <g fill="#3f3f46">
      <rect x="36" y="152" width="22" height="18" rx="3"/>
      <rect x="62" y="152" width="20" height="18" rx="3"/>
      <rect x="86" y="152" width="20" height="18" rx="3"/>
      <rect x="110" y="152" width="100" height="18" rx="3" fill="#e4e4e7"/> <!-- Spacebar Accent -->
      <rect x="214" y="152" width="18" height="18" rx="3"/>
      <rect x="236" y="152" width="16" height="18" rx="3"/>
      <rect x="256" y="152" width="16" height="18" rx="3"/>
      <rect x="276" y="152" width="16" height="18" rx="3"/>
    </g>
  </g>
</svg>
