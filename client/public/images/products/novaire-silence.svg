<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="blackMatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="50%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="stealthBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)" transform="translate(10, 10)">
    <!-- Headband Arc Matte Black -->
    <path d="M 60 160 C 60 55, 240 55, 240 160" fill="none" stroke="url(#blackMatte)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 75 145 C 75 75, 225 75, 225 145" fill="none" stroke="#48484a" stroke-width="6" stroke-linecap="round"/>

    <!-- Slender Hinge Stems -->
    <rect x="52" y="145" width="16" height="42" rx="8" fill="#2c2c2e"/>
    <rect x="232" y="145" width="16" height="42" rx="8" fill="#2c2c2e"/>

    <!-- Left Large Acoustic Chamber -->
    <circle cx="60" cy="195" r="44" fill="url(#stealthBlack)" stroke="#3a3a3c" stroke-width="2"/>
    <circle cx="60" cy="195" r="26" fill="#1c1c1e"/>
    <!-- Mic grille dots for ANC -->
    <circle cx="48" cy="175" r="2" fill="#636366"/>
    <circle cx="52" cy="175" r="2" fill="#636366"/>
    <circle cx="56" cy="175" r="2" fill="#636366"/>

    <!-- Right Large Acoustic Chamber -->
    <circle cx="240" cy="195" r="44" fill="url(#stealthBlack)" stroke="#3a3a3c" stroke-width="2"/>
    <circle cx="240" cy="195" r="26" fill="#1c1c1e"/>
    <!-- Mic grille dots for ANC -->
    <circle cx="228" cy="175" r="2" fill="#636366"/>
    <circle cx="232" cy="175" r="2" fill="#636366"/>
    <circle cx="236" cy="175" r="2" fill="#636366"/>
  </g>
</svg>
