<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="ramChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldConnector" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadowRam" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadowRam)" transform="translate(50, 75)">
    <!-- SODIMM PCB Board (Standard 69.6mm x 30mm ratio) -->
    <rect x="0" y="0" width="300" height="135" rx="6" fill="url(#pcbGreen)" stroke="#14532d" stroke-width="1.5"/>
    
    <!-- PCB Notch & Alignment holes -->
    <circle cx="15" cy="15" r="4" fill="#0f172a"/>
    <circle cx="285" cy="15" r="4" fill="#0f172a"/>
    <rect x="110" y="123" width="8" height="14" rx="2" fill="#0f172a"/>

    <!-- 4 Black BGA Memory Chips on Top -->
    <rect x="25" y="20" width="48" height="40" rx="3" fill="url(#ramChip)" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="49" y="44" fill="#71717a" font-family="monospace" font-size="7" text-anchor="middle">SEC</text>
    
    <rect x="85" y="20" width="48" height="40" rx="3" fill="url(#ramChip)" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="109" y="44" fill="#71717a" font-family="monospace" font-size="7" text-anchor="middle">SEC</text>

    <rect x="165" y="20" width="48" height="40" rx="3" fill="url(#ramChip)" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="189" y="44" fill="#71717a" font-family="monospace" font-size="7" text-anchor="middle">SEC</text>

    <rect x="225" y="20" width="48" height="40" rx="3" fill="url(#ramChip)" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="249" y="44" fill="#71717a" font-family="monospace" font-size="7" text-anchor="middle">SEC</text>

    <!-- OEM Specification Label Sticker -->
    <rect x="25" y="70" width="248" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <text x="35" y="86" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">SAMSUNG / SK HYNIX OEM</text>
    <text x="35" y="99" fill="#334155" font-family="monospace" font-size="9">DDR4 3200MHz SODIMM 1.2V CL22</text>
    <text x="35" y="110" fill="#64748b" font-family="monospace" font-size="8">TESTED MEMTEST86 100% PASS • GRADE A COPOTAN</text>

    <!-- QC Pass Badge -->
    <rect x="215" y="76" width="50" height="18" rx="3" fill="#15803d"/>
    <text x="240" y="89" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">QC PASSED</text>

    <!-- Gold Edge Connector Pins -->
    <rect x="8" y="126" width="98" height="9" fill="url(#goldConnector)"/>
    <rect x="122" y="126" width="170" height="9" fill="url(#goldConnector)"/>
  </g>
</svg>
