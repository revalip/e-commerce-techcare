# =======================================================
# Konfigurasi Nginx untuk NOVAIRE di aaPanel
# Letakkan di: Site Settings -> Config File (dalam blok server {})
# =======================================================

# 1. Routing Frontend SPA (React Vite)
location / {
    root /www/wwwroot/novaire/client/dist;
    index index.html;
    try_files $uri $uri/ /index.html;
}

# 2. Reverse Proxy Backend API ke Node.js (Port 4000)
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# 3. Static Uploads (Foto Produk & Bukti Transfer)
location /uploads/ {
    alias /www/wwwroot/novaire/server/uploads/;
    expires 30d;
    add_header Cache-Control "public, no-transform";
}

# 4. Limit Upload File Size (Maksimal 10MB)
client_max_body_size 10M;
